name: Deploy to COS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Tencent COS
        run: |
          pip install -q cos-python-sdk-v5
          python3 << 'PYEOF'
          import os
          import mimetypes
          from qcloud_cos import CosConfig, CosS3Client

          config = CosConfig(
              Region=os.environ['COS_REGION'],
              SecretId=os.environ['TENCENT_CLOUD_SECRET_ID'],
              SecretKey=os.environ['TENCENT_CLOUD_SECRET_KEY']
          )
          client = CosS3Client(config)
          bucket = os.environ['COS_BUCKET']

          skip = {'.git', '.github', '__pycache__', 'node_modules'}
          total = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in skip]
              for f in files:
                  local_path = os.path.join(root, f)
                  remote_key = os.path.relpath(local_path)

                  content_type, _ = mimetypes.guess_type(local_path)
                  if content_type is None:
                      content_type = 'application/octet-stream'

                  if f.endswith('.html'):
                      content_type = 'text/html'
                  elif f.endswith('.css'):
                      content_type = 'text/css'
                  elif f.endswith('.js'):
                      content_type = 'application/javascript'
                  elif f.endswith('.json'):
                      content_type = 'application/json'

                  print(f'Uploading: {remote_key} ({content_type})')
                  with open(local_path, 'rb') as fp:
                      client.put_object(
                          Bucket=bucket,
                          Body=fp,
                          Key=remote_key,
                          ContentType=content_type
                      )
                  total += 1

          print(f'\nDone! Total {total} files uploaded.')
          PYEOF
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
